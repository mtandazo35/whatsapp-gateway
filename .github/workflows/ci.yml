name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cuatro jobs independientes: una auditoría de dependencias en rojo no debe ocultar
# una regresión funcional (antes e2e y docker dependían del job que hacía el audit).
jobs:
  api:
    name: API (build, pruebas, formato)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Instalar (npm ci)
        run: npm ci --no-audit --no-fund
      - name: Compilar
        run: npm run build
      - name: Pruebas unitarias
        run: npx jest --ci --colors=false
      - name: Formato (prettier --check)
        run: npm run format:check
      - name: Lint
        run: npm run lint -- --max-warnings=0

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: npm audit (producción, alta o crítica)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (informativo, todo)
        if: always()
        run: npm audit --omit=dev || true

  e2e:
    name: e2e con Postgres y Redis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: whatsapp
          POSTGRES_PASSWORD: whatsapp
          POSTGRES_DB: whatsapp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U whatsapp -d whatsapp"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: whatsapp
      POSTGRES_PASSWORD: whatsapp
      POSTGRES_DB: whatsapp
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: Ci.Password1
      PORT: 3005
      # Baileys es ESM y la API lo carga con import() dinámico: Jest necesita este flag.
      NODE_OPTIONS: --experimental-vm-modules
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: e2e
        run: npm run test:e2e -- --ci --colors=false

  shell:
    name: Scripts de shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: bash -n
        run: bash -n install.sh scripts/backup.sh scripts/restore.sh
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning install.sh scripts/backup.sh scripts/restore.sh
      - name: Finales de línea LF
        run: |
          if git ls-files -z '*.sh' | xargs -0 grep -l $'\r' ; then echo "CRLF en scripts"; exit 1; fi

  docker:
    name: Imagen de la API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build -t whatsapp-gateway-api:ci ./api
      - name: La imagen arranca y falla limpio sin JWT_SECRET
        run: |
          set +e
          out=$(docker run --rm whatsapp-gateway-api:ci 2>&1)
          echo "$out" | tail -3
          echo "$out" | grep -q "JWT_SECRET" && echo "OK: exige JWT_SECRET" || { echo "la imagen no valida JWT_SECRET"; exit 1; }
