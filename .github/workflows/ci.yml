name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (build, pruebas, auditoría)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Instalar (npm ci)
        run: npm ci --no-audit --no-fund
      - name: Compilar
        run: npm run build
      - name: Pruebas unitarias
        run: npx jest --ci --colors=false
      - name: Lint (sin --fix)
        run: npx eslint "src/**/*.ts" --max-warnings=0 || echo "::warning::eslint reporta avisos; revisar"
      - name: Auditoría de dependencias (alta o crítica)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: e2e con Postgres y Redis
    runs-on: ubuntu-latest
    needs: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: whatsapp
          POSTGRES_PASSWORD: whatsapp
          POSTGRES_DB: whatsapp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U whatsapp -d whatsapp"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: whatsapp
      POSTGRES_PASSWORD: whatsapp
      POSTGRES_DB: whatsapp
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: Ci.Password1
      PORT: 3005
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: e2e
        run: npm run test:e2e -- --ci --colors=false

  shell:
    name: Scripts de shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: bash -n install.sh scripts/backup.sh scripts/restore.sh
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning install.sh scripts/backup.sh scripts/restore.sh
      - name: Finales de línea LF
        run: |
          if git ls-files -z '*.sh' | xargs -0 grep -l $'\r' ; then echo "CRLF en scripts"; exit 1; fi

  docker:
    name: Imagen de la API
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t whatsapp-gateway-api:ci ./api
